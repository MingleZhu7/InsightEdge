<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPE Baseline · RexSeek</title>
<style>
body{background:#08111a;color:#d8f3ff;font:14px/1.6 system-ui;margin:0;padding:28px}
h1{font-size:20px}.muted{color:#6f93a5;margin-bottom:18px}
.panel{max-width:860px;margin:auto;border:1px solid #1b3546;border-radius:12px;padding:20px;background:#0b1824}
input[type=file]{color:#d8f3ff;margin:8px 0 14px}
button{background:#123445;color:#7ef0dc;border:1px solid #2b6f72;border-radius:8px;padding:9px 16px;cursor:pointer}
pre{background:#08131e;border:1px solid #163044;border-radius:8px;padding:14px;white-space:pre-wrap;max-height:520px;overflow:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:12px;margin-right:6px}
.worn{background:#0e3b2b;color:#79f2b2;border:1px solid #1f7a55}.not{background:#3d1c1c;color:#ff9b8f;border:1px solid #8a3a32}
</style></head>
<body><div class="panel">
<h1>安全帽 Baseline <span class="muted">GroundingDINO open-vocab</span></h1>
<div class="muted">上传工地/人员图片，检测 person + safety helmet，并按头部区域做佩戴关联。路线 A：快速 baseline，精度受限于 open-vocab。</div>
<input id="file" type="file" accept="image/*">
<button onclick="run()">开始检测</button>
<div id="msg" class="muted"></div>
<pre id="out">ready</pre>
</div>
<script>
async function run(){
  const f=document.getElementById('file').files[0]; if(!f)return;
  const out=document.getElementById('out'), msg=document.getElementById('msg');
  msg.textContent='读取图片…';
  const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
  msg.textContent='推理中…';
  const t=performance.now();
  try{
    const resp=await fetch('/api/ppe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:data})});
    const d=await resp.json();
    d._wall_s=((performance.now()-t)/1000).toFixed(2);
    out.textContent=JSON.stringify(d,null,2);
    msg.innerHTML = d.summary ? `persons ${d.summary.persons} · <span class="badge worn">worn ${d.summary.worn}</span><span class="badge not">not worn ${d.summary.not_worn}</span>` : '';
  }catch(e){out.textContent=String(e);msg.textContent='请求失败';}
}
</script></body></html>

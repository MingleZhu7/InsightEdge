<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insight · 巡检任务台</title>
<style>
:root{--bg:#071018;--panel:#0b1a25;--line:#1b3546;--ink:#d8f3ff;--muted:#6f93a5;--cyan:#35e0ff;--red:#ff5c5c;--green:#2ee6a8;--amber:#ffd84d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;letter-spacing:.05em}.sub{color:var(--muted);font-size:12px;margin-left:10px}
.badge{font-size:11px;padding:4px 8px;border:1px solid #2b6f72;border-radius:5px;color:#7ef0dc;background:#0e2a2e}
main{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;padding:18px 24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;text-transform:uppercase}
#preview{width:100%;min-height:360px;background:#050b10;border:1px solid #122b3a;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#preview img{max-width:100%;max-height:560px;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{background:#123445;color:#7ef0dc;border:1px solid #2b6f72;border-radius:7px;padding:8px 13px;cursor:pointer;font:inherit}
button.primary{background:#1a4a40;color:#9dffd9;border-color:#2c8a6b}
.file{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.metric{background:#08131e;border:1px solid #163044;border-radius:7px;padding:9px}.metric b{display:block;font-size:18px;color:#fff}.metric span{font-size:10px;color:var(--muted)}
.finding{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid #163044;border-radius:7px;margin:6px 0;background:#08131e}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}.dot.ok{background:var(--green)}
.finding .t{font-weight:600}.finding .m{color:var(--muted);font-size:11px;margin-left:auto}
.rule{padding:7px 10px;border-left:3px solid var(--red);background:#1a0e12;margin:5px 0;border-radius:0 6px 6px 0;font-size:12px}
.rule.ok{border-color:var(--green);background:#0a1f19}
#evidence img{max-width:100%;border-radius:7px;border:1px solid #163044;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:6px 5px;border-bottom:1px solid #122b3a;color:#b7dbe8}th{color:var(--muted);font-weight:400}
a{color:var(--cyan)}.muted{color:var(--muted)}.warn{color:var(--amber)}
</style></head>
<body>
<header><div><h1>Insight · 巡检任务台</h1><span class="sub">一句话找隐患 · 本地推理 · 工具执行</span></div><span class="badge" id="offline">OFFLINE · LOCAL</span></header>
<main>
  <section class="panel">
    <h2>Mission Input</h2>
    <div id="preview"><span class="muted">上传巡检图片</span></div>
    <div class="tools"><input class="file" id="file" type="file" accept="image/*">
      <button class="primary" onclick="runMission()">执行：未戴安全帽</button>
      <button onclick="loadEvents()">刷新台账</button>
    </div>
    <div class="muted" style="margin-top:8px">任务：找出未佩戴安全帽的人员 → person/helmet → head 关联 → 规则判断 → 证据落盘</div>
    <div id="answer" class="warn" style="margin-top:10px"></div>
    <div id="evidence"></div>
  </section>
  <section class="panel">
    <h2>Findings</h2>
    <div class="grid"><div class="metric"><b id="mPersons">-</b><span>PERSONS</span></div><div class="metric"><b id="mWorn">-</b><span>WORN</span></div><div class="metric"><b id="mNot" style="color:#ff8f8f">-</b><span>NO HELMET</span></div></div>
    <div id="findings" class="muted">等待任务</div>
    <h2 style="margin-top:16px">Rule Check</h2><div id="rules" class="muted">—</div>
    <h2 style="margin-top:16px">Metrics</h2><div id="metrics" class="muted">—</div>
  </section>
</main>
<section class="panel" style="margin:0 24px 24px"><h2>Event Ledger</h2><div id="events" class="muted">暂无事件</div></section>
<script>
let lastImage=null;
function setImage(src){lastImage=src;document.getElementById('preview').innerHTML=`<img src="${src}" alt="preview">`}
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setImage(r.result);r.readAsDataURL(f)});
async function runMission(){
  if(!lastImage){document.getElementById('answer').textContent='请先上传图片';return}
  document.getElementById('answer').textContent='推理中…';
  document.getElementById('findings').textContent='Perception / Rule Check 执行中…';
  const t=performance.now();
  try{
    const r=await fetch('/api/mission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mission:'ppe_helmet',query:'找出没戴安全帽的人',image:lastImage})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
    document.getElementById('answer').textContent=`${d.answer} · ${((performance.now()-t)/1000).toFixed(2)}s`;
    document.getElementById('mPersons').textContent=d.summary.persons;
    document.getElementById('mWorn').textContent=d.summary.worn;
    document.getElementById('mNot').textContent=d.summary.not_worn;
    document.getElementById('findings').innerHTML=(d.findings||[]).map((p,i)=>`<div class="finding"><span class="dot ${p.status==='worn'?'ok':''}"></span><span class="t">${p.status==='worn'?'已佩戴安全帽':'未佩戴安全帽'}</span><span class="muted">#${i+1} · ${p.confidence}</span></div>`).join('')||'<span class="muted">无人员</span>';
    document.getElementById('rules').innerHTML=(d.rules||[]).map(x=>`<div class="rule ${x.passed?'ok':''}">${x.name} · ${x.passed?'PASS':'FAIL'} ${x.violations?`· ${x.violations} 个违规`:''}</div>`).join('');
    document.getElementById('metrics').textContent=`Perception ${d.metrics.perception_ms} ms · Rule ${d.metrics.rule_ms} ms · Total ${d.metrics.total_ms} ms`;
    document.getElementById('evidence').innerHTML=d.evidence?`<img src="${d.evidence}?t=${Date.now()}" alt="evidence"><div class="muted">Evidence: ${d.evidence}</div>`:'';
    await loadEvents();
  }catch(e){document.getElementById('answer').textContent='失败：'+e.message;document.getElementById('findings').textContent='—'}
}
async function loadEvents(){
  try{const r=await fetch('/api/events');const d=await r.json();const ev=d.events||[];document.getElementById('events').innerHTML=ev.length?`<table><tr><th>时间</th><th>任务</th><th>人员</th><th>未戴</th><th>结论</th><th>证据</th></tr>${ev.map(x=>`<tr><td>${x.ts}</td><td>${x.mission}</td><td>${x.persons}</td><td>${x.not_worn}</td><td>${x.answer}</td><td>${x.evidence?`<a href="${x.evidence}" target="_blank">查看</a>`:'—'}</td></tr>`).join('')}</table>`:'<span class="muted">暂无事件</span>'}catch(e){}
}
loadEvents();
</script></body></html>

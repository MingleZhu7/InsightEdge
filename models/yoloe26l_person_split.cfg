[Common]
mode = build

[Parser]
model_type = onnx
model_name = yoloe26l_person_split
model_domain = object_detection
input_model = ./yoloe-26l-person-split.onnx
input = images
input_shape = [1, 3, 640, 640]
output = box_out, score_out, mask_out, output1
output_dir = ./out

[Optimizer]
bias_effective_bits = 32
quantize_method_for_activation = per_tensor_symmetric_full_range
cast_dtypes_for_lib = True
trigger_float_op = disable
weight_bits = 8
bias_bits = 32
activation_bits = 8
output_dir = ./out
dump = False
save_statistic_info = True
dataset = numpydataset
calibration_data = ./calib_yoloe_real.npy
quantize_method_for_weight = per_tensor_symmetric_restricted_range

[GBuilder]
outputs = yoloe26l_person_split_i8.cix
target = X2_1204MP3
ocm_addr = 0xa0017000
ocm_size = 0x3000
tiling = fps
